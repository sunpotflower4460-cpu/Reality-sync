name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Emit generated lockfile for bootstrap
        run: |
          echo '===REALITYSYNC_LOCK_GZIP_BASE64_BEGIN==='
          gzip -c package-lock.json | base64 -w0
          echo
          echo '===REALITYSYNC_LOCK_GZIP_BASE64_END==='

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
